<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verktyg</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1d2b36;
    --muted: #5b6b76;
    --accent: #2f6f8f;
    --line: #c9d6dc;
    --error: #a12a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.5;
  }

  /* ---------- Sidolayout ---------- */
  .sida {
    display: grid;
    grid-template-columns: minmax(14rem, 22rem) 1fr;
    min-height: 100vh;
  }
  nav {
    padding: 2.5rem 1.75rem;
    border-right: 4px solid var(--accent);
    font-family: "Segoe UI", Calibri, Arial, sans-serif;
  }
  nav h1 {
    margin: 0 0 2rem;
    font-size: 0.95rem;
    font-weight: 400;
    line-height: 1.55;
    color: var(--muted);
  }
  /* Första raden ("Välkommen") blir rubriken */
  nav h1::first-line {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: 0.01em;
    color: #1f566f;
  }
  /* Liten färgad linje under texten */
  nav h1::after {
    content: "";
    display: block;
    width: 3rem;
    height: 3px;
    margin-top: 1rem;
    background: #f0b429;
    border-radius: 2px;
  }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav li { margin-bottom: 0.4rem; }
  nav a {
    display: block;
    padding: 0.35rem 0.5rem;
    color: var(--accent);
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
    border-radius: 4px;
  }
  nav a::before { content: "- "; }
  nav a:hover { text-decoration: underline; }
  nav a[aria-current="page"] { background: #e6eff4; }
  a:focus-visible, input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 3px solid #f0b429;
    outline-offset: 2px;
  }

  main { padding: 3rem 2rem; }
  .verktyg { width: 100%; max-width: 30rem; margin: 0 auto; }
  .verktyg h2.titel { margin: 0 0 1.25rem; font-size: 1.9rem; line-height: 1.2; }

  /* ---------- Formulär ---------- */
  .falt { margin-bottom: 1rem; }
  label { display: block; margin-bottom: 0.3rem; color: var(--muted); }
  input, select {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  button {
    padding: 0.65rem 1.2rem;
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #255a75; }
  .fel { min-height: 1.5rem; margin: 0.75rem 0 0; color: var(--error); }
  .resultat { margin-top: 1rem; }
  .resultat h3 { margin: 0 0 0.5rem; font-size: 1.15rem; }
  dl { margin: 0; }
  .rad {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.45rem 0;
    border-bottom: 1px solid var(--line);
  }
  .rad:last-child { border-bottom: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 700; text-align: right; }
  [hidden] { display: none !important; }

  /* ---------- Mobil: menyn hamnar överst ---------- */
  @media (max-width: 700px) {
    .sida { grid-template-columns: 1fr; min-height: 0; }
    nav { border-right: 0; border-bottom: 4px solid var(--accent); padding: 1.5rem 1.25rem; }
    nav h1 { margin-bottom: 1rem; }
    main { padding: 1.75rem 1.25rem; }
  }
</style>
</head>
<body>
<div class="sida">

  <nav aria-label="Verktyg">
    <h1>Välkommen<br>Välj vilket verktyg du vill använda idag</h1>
    <!-- Menyn byggs automatiskt av verktygen i <main> -->
    <ul id="meny"></ul>
  </nav>

  <main>
    <!--
      LÄGGA TILL ETT NYTT VERKTYG:
      Kopiera ett <section class="verktyg" ...>-block nedan, ge det ett nytt
      unikt id och en ny data-titel. Då dyker det upp i menyn till vänster.
    -->

    <!-- ===== Verktyg 1: Marginalkalkylator ===== -->
    <section class="verktyg" id="marginalkalkylator" data-titel="Marginalkalkylator" hidden>
      <h2 class="titel">Marginalkalkylator</h2>

      <div class="falt">
        <label for="moms">Moms</label>
        <select id="moms">
          <option value="6" selected>6 %</option>
          <option value="12">12 %</option>
          <option value="25">25 %</option>
        </select>
      </div>

      <div class="falt">
        <label for="inpris">Inpris i kr</label>
        <input id="inpris" type="text" inputmode="decimal" autocomplete="off">
      </div>

      <div class="falt">
        <label for="utpris">Utpris i kr (inklusive moms)</label>
        <input id="utpris" type="text" inputmode="decimal" autocomplete="off">
      </div>

      <div class="falt">
        <label for="losenord">Lösenord</label>
        <input id="losenord" type="password" autocomplete="off">
      </div>

      <button id="berakna" type="button">Beräkna</button>
      <p id="fel" class="fel" role="alert"></p>

      <section id="resultat" class="resultat" hidden aria-live="polite">
        <h3>Här kommer svaret</h3>
        <dl>
          <div class="rad"><dt>Moms i %</dt><dd id="r-moms"></dd></div>
          <div class="rad"><dt>Inpris i kr</dt><dd id="r-inpris"></dd></div>
          <div class="rad"><dt>Marginal %</dt><dd id="r-procent"></dd></div>
          <div class="rad"><dt>Marginal kr</dt><dd id="r-marginal"></dd></div>
          <div class="rad"><dt>Pris ex moms</dt><dd id="r-pex"></dd></div>
          <div class="rad"><dt>Utpris i kr</dt><dd id="r-utpris"></dd></div>
        </dl>
      </section>
    </section>

  </main>
</div>

<script>
  /* ================= Meny och verktygsval ================= */
  (function () {
    const verktyg = Array.from(document.querySelectorAll(".verktyg"));
    const meny = document.getElementById("meny");

    verktyg.forEach(function (v) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#" + v.id;
      a.textContent = v.dataset.titel;
      li.appendChild(a);
      meny.appendChild(li);
    });

    function visaVerktyg() {
      const id = location.hash.slice(1);
      const valt = verktyg.find(function (v) { return v.id === id; }) || verktyg[0];
      verktyg.forEach(function (v) { v.hidden = (v !== valt); });
      meny.querySelectorAll("a").forEach(function (a) {
        if (a.getAttribute("href") === "#" + valt.id) {
          a.setAttribute("aria-current", "page");
        } else {
          a.removeAttribute("aria-current");
        }
      });
      document.title = valt.dataset.titel + " – Verktyg";
    }

    window.addEventListener("hashchange", visaVerktyg);
    visaVerktyg();
  })();

  /* ================= Verktyg 1: Marginalkalkylator ================= */
  (function () {
    // Omvandlar momssats till rätt beräkningsgrund (samma värden som i Python-scriptet)
    const BAKMOMS = { 6: 5.66, 12: 10.71, 25: 20 };

    // Hårdkodat lösenord (första versionen)
    const LOSENORD = "N0rrland";

    const momsFalt = document.getElementById("moms");
    const losenordFalt = document.getElementById("losenord");
    const inprisFalt = document.getElementById("inpris");
    const utprisFalt = document.getElementById("utpris");
    const fel = document.getElementById("fel");
    const resultat = document.getElementById("resultat");

    function tillTal(text) {
      const rensat = text.trim().replace(/\s/g, "").replace(",", ".");
      if (rensat === "") return NaN;
      return Number(rensat);
    }

    function avrunda(tal) {
      return Math.round((tal + Number.EPSILON) * 100) / 100;
    }

    function visa(tal) {
      return tal.toFixed(2).replace(".", ",");
    }

    function berakna() {
      fel.textContent = "";
      resultat.hidden = true;

      if (losenordFalt.value !== LOSENORD) {
        fel.textContent = "Ange korrekt lösenord";
        losenordFalt.focus();
        return;
      }

      const moms = Number(momsFalt.value);
      const bakmoms = BAKMOMS[moms];
      if (bakmoms === undefined) {
        fel.textContent = "Felaktig momssats. Välj 6, 12 eller 25.";
        return;
      }

      const ppe = tillTal(inprisFalt.value);
      const utpris = tillTal(utprisFalt.value);

      if (Number.isNaN(ppe)) {
        fel.textContent = "Ange inpris som ett tal, till exempel 80 eller 79,50.";
        inprisFalt.focus();
        return;
      }
      if (Number.isNaN(utpris)) {
        fel.textContent = "Ange utpris som ett tal, till exempel 125 eller 124,50.";
        utprisFalt.focus();
        return;
      }

      // Pris ex moms
      const pex = avrunda(utpris - (utpris * bakmoms / 100));
      if (pex === 0) {
        fel.textContent = "Priset ex moms blir 0, så marginalen i procent kan inte beräknas.";
        utprisFalt.focus();
        return;
      }

      // Marginal i kr och i procent
      const marginal = avrunda(pex - ppe);
      const marginalprocent = avrunda(marginal / pex * 100);

      document.getElementById("r-moms").textContent = moms + " %";
      document.getElementById("r-inpris").textContent = visa(ppe) + " kr";
      document.getElementById("r-procent").textContent = visa(marginalprocent) + " %";
      document.getElementById("r-marginal").textContent = visa(marginal) + " kr";
      document.getElementById("r-pex").textContent = visa(pex) + " kr";
      document.getElementById("r-utpris").textContent = visa(utpris) + " kr";
      resultat.hidden = false;
    }

    document.getElementById("berakna").addEventListener("click", berakna);
    [inprisFalt, utprisFalt, losenordFalt].forEach(function (f) {
      f.addEventListener("keydown", function (e) {
        if (e.key === "Enter") berakna();
      });
    });
  })();
</script>
</body>
</html>
